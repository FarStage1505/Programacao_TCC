<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Tela de cadastro da plataforma LoadSense"
  >

  <title>LoadSense | Cadastro</title>

  <link rel="stylesheet" href="style.css">

  <script src="script.js" defer></script>
</head>

<body>
  <main class="page-container">
    <section
      class="auth-container register-container"
      aria-labelledby="register-title"
    >
      <header class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path
              d="M30.5 8.5H20.4C14.4 8.5 9.5 13.4 9.5 19.4V21.6C9.5 27.6 14.4 32.5 20.4 32.5H27.5C29.8 32.5 31.6 34.3 31.6 36.6C31.6 38.9 29.8 40.7 27.5 40.7H17.5"
            />

            <path
              d="M17.5 39.5H27.6C33.6 39.5 38.5 34.6 38.5 28.6V26.4C38.5 20.4 33.6 15.5 27.6 15.5H20.5C18.2 15.5 16.4 13.7 16.4 11.4C16.4 9.1 18.2 7.3 20.5 7.3H30.5"
            />
          </svg>
        </div>

        <div class="brand-text">
          <div class="brand-name">
            LOAD<span>SENSE</span>
          </div>

          <p>SUA LOGÍSTICA EM TEMPO REAL</p>
        </div>
      </header>

      <form
        class="auth-card"
        id="registerForm"
        autocomplete="on"
        novalidate
      >
        <div class="card-heading">
          <h1 id="register-title">Crie sua conta</h1>

          <p>
            Cadastre-se para acessar a plataforma LoadSense
          </p>
        </div>

        <div class="field-group">
          <label for="registerName">Nome completo</label>

          <div class="input-container">
            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="12" cy="8" r="4" />

              <path
                d="M4.5 20C5.2 15.8 7.7 14 12 14C16.3 14 18.8 15.8 19.5 20"
              />
            </svg>

            <input
              id="registerName"
              name="name"
              type="text"
              placeholder="Digite seu nome completo"
              autocomplete="name"
              minlength="3"
              required
            >
          </div>

          <small
            class="field-error"
            id="registerNameError"
            aria-live="polite"
          ></small>
        </div>

        <div class="field-group">
          <label for="registerEmail">E-mail</label>

          <div class="input-container">
            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect
                x="3.5"
                y="5.5"
                width="17"
                height="13"
                rx="2"
              />

              <path d="M4.5 7L12 12.5L19.5 7" />
            </svg>

            <input
              id="registerEmail"
              name="email"
              type="email"
              placeholder="seuemail@exemplo.com"
              autocomplete="email"
              inputmode="email"
              required
            >
          </div>

          <small
            class="field-error"
            id="registerEmailError"
            aria-live="polite"
          ></small>
        </div>

        <div class="fields-row">
          <div class="field-group">
            <label for="registerPassword">Senha</label>

            <div class="input-container">
              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <rect
                  x="5"
                  y="10"
                  width="14"
                  height="10"
                  rx="2"
                />

                <path d="M8 10V7A4 4 0 0 1 16 7V10" />
              </svg>

              <input
                id="registerPassword"
                name="password"
                type="password"
                placeholder="Crie sua senha"
                autocomplete="new-password"
                minlength="8"
                required
              >

              <button
                class="password-toggle"
                type="button"
                data-password-toggle="registerPassword"
                aria-label="Mostrar senha"
                aria-pressed="false"
              >
                <svg
                  class="eye-visible"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    d="M2.5 12S6 6 12 6S21.5 12 21.5 12S18 18 12 18S2.5 12 2.5 12Z"
                  />

                  <circle cx="12" cy="12" r="2.7" />
                </svg>

                <svg
                  class="eye-hidden"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path d="M3 3L21 21" />

                  <path
                    d="M10.6 6.2A8.8 8.8 0 0 1 12 6C18 6 21.5 12 21.5 12A16.4 16.4 0 0 1 18.5 15.7"
                  />

                  <path
                    d="M6.2 6.2A15.6 15.6 0 0 0 2.5 12S6 18 12 18A8.8 8.8 0 0 0 15 17.5"
                  />

                  <path
                    d="M9.9 9.9A3 3 0 0 0 14.1 14.1"
                  />
                </svg>
              </button>
            </div>

            <small
              class="field-error"
              id="registerPasswordError"
              aria-live="polite"
            ></small>
          </div>

          <div class="field-group">
            <label for="registerConfirmPassword">
              Confirmar senha
            </label>

            <div class="input-container">
              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <rect
                  x="5"
                  y="10"
                  width="14"
                  height="10"
                  rx="2"
                />

                <path d="M8 10V7A4 4 0 0 1 16 7V10" />
              </svg>

              <input
                id="registerConfirmPassword"
                name="confirmPassword"
                type="password"
                placeholder="Repita sua senha"
                autocomplete="new-password"
                minlength="8"
                required
              >

              <button
                class="password-toggle"
                type="button"
                data-password-toggle="registerConfirmPassword"
                aria-label="Mostrar senha"
                aria-pressed="false"
              >
                <svg
                  class="eye-visible"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    d="M2.5 12S6 6 12 6S21.5 12 21.5 12S18 18 12 18S2.5 12 2.5 12Z"
                  />

                  <circle cx="12" cy="12" r="2.7" />
                </svg>

                <svg
                  class="eye-hidden"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path d="M3 3L21 21" />

                  <path
                    d="M10.6 6.2A8.8 8.8 0 0 1 12 6C18 6 21.5 12 21.5 12A16.4 16.4 0 0 1 18.5 15.7"
                  />

                  <path
                    d="M6.2 6.2A15.6 15.6 0 0 0 2.5 12S6 18 12 18A8.8 8.8 0 0 0 15 17.5"
                  />

                  <path
                    d="M9.9 9.9A3 3 0 0 0 14.1 14.1"
                  />
                </svg>
              </button>
            </div>

            <small
              class="field-error"
              id="registerConfirmPasswordError"
              aria-live="polite"
            ></small>
          </div>
        </div>

        <ul class="password-requirements">
          <li>A senha deve possuir pelo menos 8 caracteres.</li>
        </ul>

        <button class="primary-button" type="submit">
          <span>Criar conta</span>

          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12H18" />
            <path d="M14 8L18 12L14 16" />
          </svg>
        </button>

        <div
          class="form-message"
          id="registerFormMessage"
          aria-live="polite"
        ></div>

        <p class="account-link">
          Já possui uma conta?

          <a href="Login.html">
            Voltar para o login
          </a>
        </p>
      </form>
    </section>
  </main>
</body>
</html>
